<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiniWeb - Forside</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="page-body">
  <div class="site-shell">
    <header class="site-header">
      <div class="header-brand">
        <img src="images/logo.svg" alt="Logo" class="header-logo" />
        <span class="header-title">MiniWeb App</span>
      </div>

      <div class="header-media-wrap">
        <img src="images/hero.svg" alt="Header billede" class="header-media" />
      </div>

      <div class="header-menu">
        <button id="btnHome" class="header-button" type="button">Forside</button>
        <button id="btnAbout" class="header-button" type="button">Om</button>
        <button id="btnGallery" class="header-button" type="button">Galleri</button>
        <button id="btnContact" class="header-button" type="button">Kontakt</button>
      </div>
    </header>

    <nav class="site-nav">
      <button id="navHome" class="nav-button" type="button">Hjem</button>
      <button id="navAbout" class="nav-button" type="button">Om os</button>
      <button id="navGallery" class="nav-button" type="button">Galleri</button>
      <button id="navContact" class="nav-button" type="button">Kontakt</button>
    </nav>

    <main class="site-main">
      <section class="content-section">
        <h1 class="content-title">Velkommen til den lille webapp</h1>
        <div class="content-grid">
          <img src="images/hero.svg" alt="Eksempelbillede" class="content-image" />
          <div class="content-text-wrap">
            <p class="content-text">Denne side viser et enkelt HTML5-layout med header, nav, main og footer.</p>
            <p class="content-text">CSS ligger i en separat fil, og JavaScript styrer klik på menuknapperne.</p>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p class="footer-text">MiniWeb App · Simpelt eksempel med HTML, CSS og JavaScript</p>
    </footer>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
