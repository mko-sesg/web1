<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiniWeb - Video</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="page-body">
  <div class="site-shell">
    <main class="site-main">
      <video id="video1" class="content-image" controls preload="metadata">
        <source src="videos/demo.mp4" type="video/mp4" />
        Din browser understøtter ikke videoafspilning.
      </video>

     

      <div class="video-controls">
        <button id="video1Play" class="nav-button" type="button">Play</button>
        <button id="video1Pause" class="nav-button" type="button">Pause</button>
      </div>
    </main>
  </div>
  <script src="js/video1.js"></script>
</body>
</html>
